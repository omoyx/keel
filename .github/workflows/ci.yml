name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      directory: ${{ steps.source.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: source
        name: Locate source and verify workflow mirror
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path('.')
          source = root if (root / 'pyproject.toml').is_file() else root / 'work'
          if not (source / 'pyproject.toml').is_file():
              raise SystemExit('Missing source pyproject.toml')
          if source != root:
              relative = '.github/workflows/ci.yml'
              if (root / relative).read_bytes() != (source / relative).read_bytes():
                  raise SystemExit('CI workflow mirror differs from the source workflow')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'directory={source.as_posix()}\n')
      - name: Check whitespace and Python syntax
        env:
          SOURCE: ${{ steps.source.outputs.directory }}
        run: |
          git diff --check HEAD^ HEAD
          python -m compileall -q "$SOURCE/keel" "$SOURCE/tests"

  portability:
    name: Portability (${{ matrix.os }}, ${{ matrix.python }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Git snapshot and entrypoint portability
        working-directory: ${{ needs.source.outputs.directory }}
        run: >-
          python -m unittest -v
          tests.test_snapshots
          tests.test_worktrees.TestWorktreeGit
          tests.test_entrypoints.TestMarkdownTargetMatching
          tests.test_entrypoints.TestEntrypointProtection.test_local_link_keeps_native_filename_semantics
          tests.test_entrypoints.TestEntrypointProtection.test_work_mode_link_still_requires_an_existing_file
          tests.test_entrypoints.TestEntrypointProtection.test_work_mode_check_uses_staged_entrypoint_not_worktree
          tests.test_entrypoints.TestEntrypointProtection.test_new_work_mode_requirement_does_not_retroactively_invalidate_history
          tests.test_init.TestInitLayout
          tests.test_skills.TestSkills.test_init_copies_keel_skill_and_mirror
          tests.test_skills.TestSkills.test_init_upgrades_legacy_work_mode_pointer_and_keeps_project_rules
          tests.test_skills.TestSkills.test_work_mode_entrypoint_is_required_and_init_repairs_it_without_losing_rules
          tests.test_skills.TestSkills.test_work_mode_accepts_project_wording_and_relative_link_not_a_fixed_template

  tests:
    name: Full suite (${{ matrix.python }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install verified integration tools
        working-directory: ${{ needs.source.outputs.directory }}
        run: bash .github/scripts/install-test-tools.sh
      - name: Run the complete suite without skips
        working-directory: ${{ needs.source.outputs.directory }}
        shell: python
        run: |
          import os
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', top_level_dir='.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Tests: {result.testsRun}; skipped: {len(result.skipped)}\n')
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)

  package:
    name: Package smoke test
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build sdist and wheel, then install outside the checkout
        working-directory: ${{ needs.source.outputs.directory }}
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" --offline --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/keel" --version
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          from importlib.resources import files
          root = files('keel').joinpath('data')
          for name in ('schema.toml', 'skills/keel/SKILL.md', 'skills/keel/references/work-mode.md'):
              assert root.joinpath(name).is_file(), name
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [source, portability, tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'CI gate failed: {failed}')
          print('All required checks passed.')
