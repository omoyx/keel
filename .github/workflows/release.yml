name: Daily release

on:
  schedule:
    - cron: "0 10 * * *" # 18:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit semantic version for a deliberate release
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'omoyx/keel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      candidate: ${{ steps.plan.outputs.candidate }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Find merged PRs not covered by a stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release.py plan --version "$REQUESTED_VERSION"

  validate:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.candidate }}

  publish:
    needs: [plan, validate]
    if: needs.plan.outputs.ready == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: ${{ runner.temp }}/release-dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false
      - name: Publish the exact tested snapshot and verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 "$GITHUB_WORKSPACE/release-control/.github/scripts/release.py" publish --dist "$RUNNER_TEMP/release-dist"
